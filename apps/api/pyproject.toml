[project]
name = "agentos-api"
version = "0.1.0"
description = "AgentOS backend: FastAPI API, LangGraph agent workflow, Celery workers"
readme = "README.md"
authors = [
    { name = "ganesh-moksha", email = "ganesh.koparde@moksha.in" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.142.2",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentos"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
